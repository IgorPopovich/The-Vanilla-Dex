<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Vanilla Dex</title>
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <h1>The Vanilla Dex</h1>
        <p class="muted">PokéAPI + Vanilla JS</p>
      </div>

      <div class="controls" role="group" aria-label="Search and filters">
        <label class="control">
          <span class="control__label">Search</span>
          <input id="search" type="search" placeholder="e.g. pikachu" autocomplete="off" />
        </label>

        <label class="control">
          <span class="control__label">Type</span>
          <select id="typeFilter">
            <option value="all" selected>All</option>
          </select>
        </label>

        <label class="control control--checkbox">
          <input id="favoritesOnly" type="checkbox" />
          <span>Favorites only</span>
        </label>

        <button id="themeToggle" class="btn btn--ghost" type="button" aria-label="Toggle theme">
          Theme
        </button>
      </div>
    </header>

    <section class="compare" aria-label="Pokémon comparison">
      <div class="compare__inner">
        <div class="compare__row">
          <label class="control">
            <span class="control__label">Compare A</span>
            <select id="compareA"></select>
          </label>
          <label class="control">
            <span class="control__label">Compare B</span>
            <select id="compareB"></select>
          </label>
        </div>

        <button id="compareBtn" class="btn" type="button">Compare</button>
      </div>

      <div id="compareResult" class="compareResult" aria-live="polite"></div>
    </section>

    <main class="page">
      <section class="galleryWrap">
        <div class="galleryHeader">
          <h2>Pokédex</h2>
          <div class="muted" id="metaLine"></div>
        </div>

        <div id="gallery" class="gallery" aria-live="polite"></div>

        <div id="bottomSentinel" class="sentinel" aria-hidden="true"></div>

        <div id="loadingLine" class="loadingLine" aria-live="polite"></div>
        <div id="emptyState" class="emptyState" hidden>
          No Pokémon found. Try another search.
        </div>
      </section>
    </main>

    <div id="modalOverlay" class="modalOverlay" hidden>
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <button class="modal__close" id="modalClose" type="button" aria-label="Close">×</button>
        <div id="modalContent" class="modalContent"></div>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
